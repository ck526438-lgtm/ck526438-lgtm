<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 420" width="1500" height="420" role="img" aria-label="Christ — développeur et fondateur, Côte d'Ivoire. SaaS, applis mobiles, trading algorithmique, outils open source.">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101833"/>
      <stop offset="1" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="ci" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f77f00"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#009e60"/>
    </linearGradient>
    <linearGradient id="nom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#3ddc97"/>
    </linearGradient>
    <radialGradient id="halo1" cx="0.82" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#009e60" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#009e60" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="0.12" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#f77f00" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f77f00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grille" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .sur { font-size: 15px; font-weight: 700; letter-spacing: 5px; fill: #8b95c9; }
    .nom { font-size: 112px; font-weight: 800; letter-spacing: -4px; }
    .role { font-size: 30px; font-weight: 500; fill: #d4d9f2; }
    .puce { font-size: 17px; font-weight: 650; fill: #e8ebff; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; fill: #7f8ab8; }
    .ok { fill: #3ddc97; }
    .or { fill: #ffb347; }
  </style>

  <rect width="1500" height="420" fill="url(#fond)"/>
  <rect width="1500" height="420" fill="url(#grille)"/>
  <rect width="1500" height="420" fill="url(#halo1)"/>
  <rect width="1500" height="420" fill="url(#halo2)"/>
  <rect x="0" y="0" width="1500" height="6" fill="url(#ci)"/>

  <text x="90" y="105" class="sur">DÉVELOPPEUR · FONDATEUR · CÔTE D'IVOIRE</text>
  <text x="84" y="222" class="nom" fill="url(#nom)">Christ</text>
  <text x="90" y="275" class="role">Je construis des logiciels pour l'Afrique francophone — et au-delà.</text>

  <g transform="translate(90 318)">
    <rect width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="75" y="26" text-anchor="middle" class="puce">SaaS</text>
    <rect x="164" width="190" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="259" y="26" text-anchor="middle" class="puce">Applis mobiles</text>
    <rect x="368" width="200" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="468" y="26" text-anchor="middle" class="puce">Trading &amp; IA</text>
    <rect x="582" width="200" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="682" y="26" text-anchor="middle" class="puce">Open source</text>
  </g>

  <!-- terminal décoratif -->
  <g transform="translate(1035 92)">
    <rect width="380" height="250" rx="16" fill="#060913" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="26" cy="24" r="6" fill="#ff5f57"/>
    <circle cx="46" cy="24" r="6" fill="#febc2e"/>
    <circle cx="66" cy="24" r="6" fill="#28c840"/>
    <text x="24" y="72" class="code"><tspan class="ok">❯</tspan> whoami</text>
    <text x="24" y="98" class="code">christ · builder indépendant</text>
    <text x="24" y="134" class="code"><tspan class="ok">❯</tspan> ls ~/projets | wc -l</text>
    <text x="24" y="160" class="code"><tspan class="or">25+</tspan> dépôts publics</text>
    <text x="24" y="196" class="code"><tspan class="ok">❯</tspan> git push origin main</text>
    <text x="24" y="222" class="code">tous les jours <tspan class="ok">✓</tspan></text>
  </g>
</svg>
